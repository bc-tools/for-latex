name    : This allows to give the name of the distributed product
#               to be used instead of the name automatically generated
#               from the folder name containing this YAML file.
#
acronym : Most names follow hidden schemas that you can explain
#               here. For example, typing "[MY] [H]idden [A]cronym"
#               clearly explains the name of the product ''myha''.
desc : This is for a small description of the product.


author  : This is to identify one single author using one of
#               the format explained below.
#
authors : This is for a list of several authors indicated via
#               a list with hyphens.
#
_xtra-1_: >
  KO
# An author can be identified using one of the following schema.

      # + verb::''<name>''
      # + verb::''<name> [<mails>]''
      # + verb::''<surnames>, <name>''
      # + verb::''<surnames>, <name> [<mails>]''"

# Here are the meaning of each parts.
#
#     1) verb::''<surnames>'' can be a coma-separated list of
#        surnames.
#
#     1) verb::''<name>'' is the name of the author.
#
#     1) verb::''<mails>'' can be a coma-separated list of emails.
###



urls: This is for a list of useful urls.

urls::repo : The url of the product repository.

urls::home : The url of a website for the product.

urls::doc  : The url of the product documentation.

licences : This is for the licences used.
licences::code   : This is the licence for the code.
licences::manual : This is the licence for the manual.
#
#
# There is two ways to give a licence.
#
#     1) Using an ID that will be managed by the Python project
#        ''ealic''.
#
#     2) Giving the path of one file containing the full text of the
#        licence with its name, both informations are mandatory, like
#        in ''path/to/my/licence.txt [My special licence]''.
###

langs : This is for the languages used.
langs::readme : This is the language of the ''README'' file(s).
langs::manual : This is the language of the manual documentation.
langs::code   : This is the language of the technical documentation
_xtra-2_: By default, the language is English. If you use another language,
# just indicate it by using the short standard language ID like
# ''fr'' or ''es'' for French and Spanish.
#
#
# refs::
#     * https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes


require  : This is to indicate several mandatory coding languages.

optional : This is to indicate several optional coding languages.


ignore : This is to complete the ''git'' list of paths to ignore
#              when producing the final product. The syntax is the same
#              as the ''gitignore'' syntax.
_xtra-3_: FFF
# tip::
#     The pipe symbol allows you to define one rule per line.
#
#     yaml::
#         ignore: |
#             rule_1
#             rule_2
#             ...
###
