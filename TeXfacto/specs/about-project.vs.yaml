###
# this::
#     date = 2024-12-29
###

project:
# -------------- #
# -- THE WHAT -- #
# -------------- #

###
# prototype::
#     name    : A name replacing the one automatically generated from
#               the name of the main folder.
#
#     acronym : A possible naming scheme for the project. For example,
#               typing yaml::''acronym: "[MY] [H]idden [A]cronym"''
#               willclearly explain the product name ''myha''.
###
  KIND* | in("name", "acronym"): >
    str

###
# prototype::
#     desc : A brief description of the product.
###
  desc: str


# ------------- #
# -- THE WHO -- #
# ------------- #

###
# prototype::
#     author : Identification of a single author.
#
# You can use one of the following formats.
#
#     + verb:''<name>''
#     + verb:''<name> [<mails>]''
#     + verb:''<first names>, <last name>''
#     + verb:''<first names>, <last name> [<mails>]''
#
# Here's what each part means.
#
#     1) verb:''<first names>'' can be a comma-separated list of first
#        names.
#
#     1) verb:''<name>'' is the author's name.
#
#     1) verb::''<mails>'' can be a comma-separated list of emails.
###
  author* | not(exist(\this.ANY_KIND.authors)): >
    author

###
# prototype::
#     authors : Identification of several authors indicated via a list
#               à la "\yaml. See above for available input formats.
###
  authors* | not(exist(\this.ANY_KIND.author)): >
    list(author)


# --------------- #
# -- THE WHERE -- #
# --------------- #

###
# prototype::
#     urls : A dictionary for filling in certain urls.
###
  urls*:
###
# prototype::
#     repo : The url of the project's repository site.
#
#     home : The url of the project website.
#
#     doc  : The url of the project manual.
###
    KIND* | in("repo", "home", "doc"): >
      url


# -------------- #
# -- LICENCES -- #
# -------------- #

###
# prototype::
#     licences : A dictionary to give the licences used.
#
# You can use one of the following formats.
#
#     1) Use of a short identifier.
#
#     2) The relative or absolute path of a file containing the full
#        text of the licence, and also the name of the licence as in
#        ''path/to/my/licence.txt [My special licence]''. Both pieces
#        of information must be provided.
###
  licences*:
###
# prototype::
#     code   : The code licence.
#
#     manual : The manual licence.
###
    KIND* | in("code", "manual"): >
      licence


# ----------- #
# -- LANGS -- #
# ----------- #

###
# prototype::
#     langs : A dictionary for the languages used, the default language
#             being English. To indicate languages, use a comma separated
#             list of short standard codes: see
#             cf:''https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes''.
#             For example, ''manual = "fr, es"'' indicates that the manual
#             is written in French and Spanish.
###
  langs*:
###
# prototype::
#     code   : The language of the technical documentation typed into
#              the source code.
#
#     manual : The language of the manual.
#
#     readme : The language of the ''README'' files.
###
    KIND* | in("code", "manual", "readme"): >
      lang | csv(lang)


# ------------------ #
# -- CODING LANGS -- #
# ------------------ #

###
# prototype::
#     require  : The programming languages required to run the project.
#
#     optional : Optional programming languages to enhance the operation
#                of the project.
###
  KIND* | in("require", "optional"): >
    list(str)


# -------------------- #
# -- FILES ANALYSED -- #
# -------------------- #

###
# prototype::
#     ignore : Rules of type \gitignore to exclude files from the final
#              product. The list provided here complements that used by
#              \git if the latter is used.
#
# tip::
#     The vertical bar is used to define one rule per line, as in the
#     following fictitious example.
#
#     yaml::
#         ignore: |
#           rule_1
#           rule_2
#           ...
###
  ignore*: str
